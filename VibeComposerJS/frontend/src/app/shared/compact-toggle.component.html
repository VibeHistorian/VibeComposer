<div class="toggle-control" [class.coded]="shortLabel() !== null">
  <button type="button" class="toggle-button vc-button vc-toggle vc-toggle-steady" [class.active]="active()" [class.mixed]="mixed()"
    [attr.aria-label]="label()" [attr.aria-pressed]="mixed() ? 'mixed' : active()" [disabled]="disabled()"
    [vcTooltip]="description() || shortLabel() || mixed() ? label() + (mixed() ? ' · Mixed values' : '') + (description() ? '\n' + description() : '') : null"
    (click)="toggled.emit()">{{ shortLabel() ?? label() }}</button>
  @if (showStatus() && inheritance() !== 'global') {
    <vc-control-heading class="toggle-heading-status" [label]="label()" [statusOnly]="true" [inheritance]="inheritance()"
      (inheritRequested)="inheritRequested.emit()" />
  }
</div>
