<section class="transport-dock" aria-label="Playback controls">
  <div class="transport-project">
    <span class="playback-indicator" [class.playing]="playback.state() === 'playing'" aria-hidden="true"></span>
    <div>
      <strong>{{ project().name }}</strong>
      <span>{{ project().key }} {{ project().scale === 'major' ? 'MAJOR' : 'MINOR' }}</span>
    </div>
  </div>

  <div class="transport-actions">
    <button type="button" class="transport-button stop-button" (click)="stop()" aria-label="Stop" title="Stop">■</button>
    <button type="button" class="transport-button play-button" (click)="togglePlayback()"
      [attr.aria-label]="playback.state() === 'playing' ? 'Pause' : playback.state() === 'paused' ? 'Resume' : 'Play'"
      [attr.title]="playback.state() === 'playing' ? 'Pause' : playback.state() === 'paused' ? 'Resume' : 'Play'">
      @if (playback.state() === 'playing') { <span aria-hidden="true">Ⅱ</span> }
      @else { <span aria-hidden="true">▶</span> }
    </button>
    <button type="button" class="transport-button loop-button" [class.active]="playback.loopEnabled()"
      [attr.aria-pressed]="playback.loopEnabled()" (click)="toggleLoop()" aria-label="Toggle loop"
      [title]="workspaceUi.selectedSectionIds().length ? 'Loop selected sections' : 'Loop full arrangement'">⟳</button>
    <button type="button" class="transport-button live-button" [class.active]="playback.liveEnabled()"
      [attr.aria-pressed]="playback.liveEnabled()" (click)="toggleLive()" aria-label="Toggle live reload"
      title="Live reload: hear MIDI edits while playing">LIVE</button>
  </div>

  <div class="transport-progress">
    <div class="position-line">
      <span>{{ positionText() }}</span>
      <span>{{ totalMeasures() }} BARS</span>
    </div>
    <div class="progress-track" role="progressbar" aria-label="Song position" [attr.aria-valuenow]="progressPercent()" aria-valuemin="0" aria-valuemax="100">
      <span [style.width.%]="progressPercent()"></span>
    </div>
  </div>

  <div class="transport-globals" aria-label="Global song settings">
    <label><span>KEY</span><select aria-label="Key" [value]="project().key" (change)="updateKey($event)">
      @for (key of keys; track key) { <option [value]="key">{{ key }}</option> }
    </select></label>
    <label><span>MODE</span><select aria-label="Mode" [value]="project().scale" (change)="updateScale($event)">
      <option value="major">Major</option><option value="natural-minor">Minor</option>
    </select></label>
    <label><span>TRANSPOSE</span><input aria-label="Transpose in semitones" type="number" min="-24" max="24" step="1"
      [value]="project().transposeSemitones ?? 0" (change)="updateTranspose($event)" /></label>
    <label><span>TEMPO</span><input aria-label="Tempo in beats per minute" type="number" min="40" max="240" step="1"
      [value]="project().tempoBpm" (change)="updateTempo($event)" /></label>
  </div>

  @if (playback.error()) {
    <p class="playback-error" role="status">{{ playback.error() }}</p>
  }
</section>
