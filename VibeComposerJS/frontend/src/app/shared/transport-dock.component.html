<section class="transport-dock" aria-label="Playback controls">
  <div class="transport-project">
    <span class="playback-indicator" [class.playing]="playback.state() === 'playing'" aria-hidden="true"></span>
    <div>
      <strong>{{ project().name }}</strong>
      <span>{{ key() }} {{ scaleDefinitions[project().scale].label.toUpperCase() }}</span>
    </div>
  </div>

  <div class="transport-actions">
    <button type="button" class="transport-button generation-button" [disabled]="workspaceUi.editingNoteId() !== null"
      (click)="generate('compose')" aria-label="Compose" title="Compose using the current seed and enabled role rules">✦</button>
    <button type="button" class="transport-button generation-button" [disabled]="workspaceUi.editingNoteId() !== null"
      (click)="generate('regenerate')" aria-label="Regenerate" title="Regenerate Melody using its enabled automatic rules">↻</button>
    <button type="button" class="transport-button stop-button" (click)="stop()" aria-label="Stop" title="Stop">■</button>
    <button type="button" class="transport-button play-button" (click)="togglePlayback()"
      [attr.aria-label]="playback.state() === 'playing' ? 'Pause' : playback.state() === 'paused' ? 'Resume' : 'Play'"
      [attr.title]="playback.state() === 'playing' ? 'Pause' : playback.state() === 'paused' ? 'Resume' : 'Play'">
      @if (playback.state() === 'playing') { <span aria-hidden="true">Ⅱ</span> }
      @else { <span aria-hidden="true">▶</span> }
    </button>
    <button type="button" class="transport-button loop-button" [class.active]="playback.loopEnabled()"
      [attr.aria-pressed]="playback.loopEnabled()" (click)="toggleLoop()" aria-label="Toggle loop"
      [title]="workspaceUi.selectedSectionIds().length ? 'Loop selected sections' : 'Loop full arrangement'">⟳</button>
    <button type="button" class="transport-button live-button" [class.active]="playback.liveEnabled()"
      [attr.aria-pressed]="playback.liveEnabled()" (click)="toggleLive()" aria-label="Toggle live reload"
      title="Live reload: hear MIDI edits while playing">LIVE</button>
    <vc-mix-buttons [trackIds]="trackIds()" label="all tracks" [allowExclusive]="false" />
  </div>

  <div class="transport-progress">
    <div class="position-line">
      <span>{{ positionText() }}</span>
      <span>{{ totalMeasures() }} BARS</span>
    </div>
    <div class="progress-track" role="slider" tabindex="0" aria-label="Song position" [attr.aria-valuenow]="progressPercent()" aria-valuemin="0" aria-valuemax="100"
      [attr.aria-valuetext]="positionText()" (click)="seek($event)" (keydown)="seekKey($event)">
      <div class="progress-rail"><span [style.transform]="'scaleX(' + progressPercent() / 100 + ')'"></span></div>
      @if (loopRegion(); as region) {
        <i class="progress-loop-line" [style.left.%]="region.left" [style.width.%]="region.width" aria-hidden="true"></i>
      }
    </div>
  </div>

  <div class="transport-globals" aria-label="Global song settings">
    <div class="global-knobs">
      <vc-compact-knob [dense]="true" label="Transpose in semitones" [defaultValue]="0" shortLabel="Transpose" unit=""
        [value]="project().transposeSemitones ?? 0" [minimum]="-24" [maximum]="24" (valueCommit)="updateTranspose($event)" />
      <vc-compact-knob [dense]="true" label="Tempo in beats per minute" [defaultValue]="120" shortLabel="BPM" unit=""
        [value]="project().tempoBpm" [minimum]="40" [maximum]="240" (valueCommit)="updateTempo($event)" />
    </div>
    <div class="mode-seed">
    <label class="mode-control"><span>MODE</span><select selectDefault="major" aria-label="Mode" [value]="project().scale" (change)="updateScale($event)">
      @for (scale of scales; track scale) {
        <option [value]="scale" [selected]="project().scale === scale">{{ scaleDefinitions[scale].label }}</option>
      }
    </select></label>
    <label class="seed-control"><span>SEED</span><input aria-label="Generation seed" inputmode="numeric" [value]="project().seed"
      [title]="'Generation seed: ' + project().seed" (change)="updateSeed($event)" (keydown.enter)="$any($event.target).blur()" /></label>
    </div>
    <vc-chordlet-editor />
  </div>

  @if (generationMessage()) { <p class="generation-message" role="status">{{ generationMessage() }}</p> }
  @if (playback.error()) {
    <p class="playback-error" role="status">{{ playback.error() }}</p>
  }
</section>
