<div class="part-controls">
  @for (control of controls(); track control.key) {
    <div class="part-control" [title]="control.description ?? ''">
      @if (control.kind === 'number') {
        <vc-compact-knob [value]="numericValue(control)" [mixed]="values()[control.key] === null"
          [minimum]="minimum(control)" [maximum]="maximum(control)"
          [step]="control.step ?? 1"
          [label]="control.label" [unit]="control.unit ?? ''"
          [showValueBelow]="control.showValueBelow ?? false" [inheritance]="inheritanceFor(control)"
          (inheritRequested)="inheritRequested.emit(control.key)"
          (valueCommit)="settingsChanged.emit({ key: control.key, value: $event })" />
      } @else {
        <vc-control-heading #heading [label]="control.label" [inheritance]="inheritanceFor(control)"
          (inheritRequested)="inheritRequested.emit(control.key)" />
        @if (control.kind === 'choice') {
          <select [id]="heading.controlId" [attr.aria-label]="control.label" [value]="values()[control.key] ?? ''" (change)="choose(control, $event)">
            @if (values()[control.key] === null) { <option value="" disabled [selected]="true">Mixed</option> }
            @for (option of control.options; track option) {
              <option [value]="option" [selected]="values()[control.key] === option">{{ option }}</option>
            }
          </select>
        } @else {
          <input [id]="heading.controlId" class="part-check" type="checkbox" [attr.aria-label]="control.label" [checked]="values()[control.key] === true"
            [indeterminate]="values()[control.key] === null"
            (change)="settingsChanged.emit({ key: control.key, value: $any($event.target).checked })" />
        }
      }
    </div>
  }
  @if (rhythmPreview() !== undefined) {
    <div class="rhythm-preview" [title]="rhythmPreviewLabel()">
      <span class="rhythm-preview-label">Rhythm preview</span>
      @if (rhythmPreview(); as pattern) {
        <div class="rhythm-preview-grid" role="img" [attr.aria-label]="rhythmPreviewLabel()">
          @for (slot of pattern; track $index) {
            <span class="rhythm-preview-slot" [class.active]="slot > 0" aria-hidden="true"></span>
          }
        </div>
      } @else {
        <span class="rhythm-preview-mixed">Mixed</span>
      }
    </div>
  }
</div>
