<section class="arrangement-panel" aria-labelledby="arrangement-title">
  <header class="canvas-heading">
    <h1 id="arrangement-title" class="brand" aria-label="VibeComposer">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span>vibe<span class="brand-light">composer</span></span>
    </h1>
    <div class="canvas-actions">
      <span class="measure-total">{{ totalMeasures() }} BARS</span>
      <button type="button" class="add-section-button" [disabled]="!canAddSection()"
        [attr.aria-expanded]="!!sectionPicker()" aria-haspopup="menu" aria-label="Add arrangement section" title="Add section"
        (click)="toggleSectionPicker($event)">＋</button>
      @if (selectedSectionIds().length) {
        <button type="button" class="reroll-button" (click)="selectionCleared.emit()" title="Clear section selection (Escape)">CLEAR</button>
      }
      <button type="button" class="reroll-button" (click)="$event.stopPropagation(); randomizeRequested.emit()"
        title="Reroll track presence using section type chances">REROLL</button>
    </div>
  </header>

  <div class="overview-scroll" #scrollHost (scroll)="onScroll()">
    <div class="overview-content" #scrollContent>
      <div class="overview-viewport" #viewport>
        <canvas #scoreCanvas tabindex="0" role="application"
          aria-label="Arrangement overview. Click section headers to select sections; Ctrl-click extends or trims and Shift-click selects a range. Click cells or track buttons to select part settings. Middle-click a track button or press I to toggle presence. Shift+middle-click a track, cell or header to reroll its track settings; Shift+right-click to reset settings and restore generated notes. Middle-click a header to duplicate its section; right-click to remove it. Escape clears selection. Use arrow keys and Enter to activate."
          aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown Enter Space Escape I"
          (click)="onCanvasClick($event)" (pointermove)="onPointerMove($event)" (pointerleave)="onPointerLeave()"
          (pointerdown)="onCanvasPointerdown($event)" (auxclick)="onCanvasAuxclick($event)"
          (contextmenu)="onCanvasContextmenu($event)"
          (keydown)="onCanvasKeydown($event)"></canvas>
        <canvas #playheadCanvas class="playhead-canvas" aria-hidden="true"></canvas>
      </div>
    </div>
  </div>
</section>
@if (sectionPicker(); as popup) {
  <div class="section-picker" role="menu" aria-label="Section choices" [style.left.px]="popup.x" [style.top.px]="popup.y"
    (keydown)="sectionPickerKey($event)">
    <span>Add section</span>
    <div>@for (type of sectionTypes; track type) {
      <button type="button" role="menuitem" (click)="chooseSection(type)">{{ sectionLabel(type) }}</button>
    }</div>
  </div>
}
