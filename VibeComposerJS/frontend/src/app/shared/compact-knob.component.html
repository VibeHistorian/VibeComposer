<label class="compact-knob" [title]="tooltip()">
  <span class="knob-label">{{ label() }}</span>
  <span class="knob-face" [style.--knob-progress]="angle()" aria-hidden="true"><span>{{ code() }}</span></span>
  <output class="knob-value">{{ shownValue() }}{{ unit() }}</output>
  <input type="range" [min]="minimum()" [max]="maximum()" [step]="step()" [value]="value()"
    [attr.aria-label]="label()" [attr.aria-valuetext]="shownValue() + unit()"
    (input)="previewValue($event)" (change)="commitValue($event)" />
</label>
