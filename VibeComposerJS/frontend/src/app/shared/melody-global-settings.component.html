<section aria-label="Global Melody musical settings">
  <p class="eyebrow">GLOBAL MELODY · ALL TRACKS AND SECTIONS</p>
  <div class="global-controls">
    <fieldset class="parameter-area" data-control-category="structure">
      <legend>Target preparation</legend>
      <p class="preparation-note">Used on Compose and enabled Regenerate. Target choices remain editable.</p>
      <label class="pattern-effect" title="Direction of prepared note targets, separate from block direction changes.">
        Target direction
        <select aria-label="Target direction" [value]="values().targetDirection ?? 'ASC'" (change)="changeTargetDirection($event)">
          <option value="ANY">Any</option>
          <option value="ASC">Ascending</option>
          <option value="DESC">Descending</option>
        </select>
      </label>
      <vc-compact-knob label="Target variation" [value]="values().targetNoteVariation ?? 3" [minimum]="1" [maximum]="6" unit=""
        description="Magnitude of prepared target directions before chord-note correction. Ascending and Descending double the draw range. Requires Automatic targets."
        (valueCommit)="settingsChanged.emit({ targetNoteVariation: $event })" />
      <vc-compact-toggle label="Directions from progression" [active]="values().useDirectionsFromProgression ?? false"
        description="Prepare target directions from successive diatonic chord roots, starting with zero, instead of a seeded direction pattern. Requires Automatic targets."
        (toggled)="settingsChanged.emit({ useDirectionsFromProgression: !(values().useDirectionsFromProgression ?? false) })" />
      <vc-compact-toggle label="Force first outline" [active]="values().forceFirstOutline ?? false"
        description="During preparation, copy the first stored Melody track's targets, structure, speed, block limits, exceptions, doubled rhythm and split chance to unlocked Melody tracks. Section overrides remain explicit."
        (toggled)="settingsChanged.emit({ forceFirstOutline: !(values().forceFirstOutline ?? false) })" />
    </fieldset>
    <fieldset class="parameter-area" data-control-category="pitch">
      <legend>Pitch</legend>
      <vc-compact-toggle label="Single note exceptions" [active]="values().singleNoteExceptions ?? false"
        description="Apply pitch exceptions only to the last note of the last block in each chord, using the full major-scale interval range. Requires Max exceptions and Note exceptions."
        (toggled)="settingsChanged.emit({ singleNoteExceptions: !(values().singleNoteExceptions ?? false) })" />
    </fieldset>
    <fieldset class="parameter-area" data-control-category="shape">
      <legend>Shape</legend>
      <label class="pattern-effect" title="Choose what repeated block identities preserve. Flex can regenerate their final block to approach the next target.">
        Pattern effect
        <select aria-label="Pattern effect" [value]="values().patternEffect ?? 2" (change)="changePatternEffect($event)">
          <option value="0">Rhythm</option>
          <option value="1">Notes</option>
          <option value="2">Rhythm + Notes</option>
        </select>
      </label>
      <vc-compact-knob label="Max direction changes" [value]="values().maxDirectionChanges ?? 2" [minimum]="1" [maximum]="6" unit=""
        description="Direction-change budget for block targets and generated shapes. Reused patterns retain Java's cached budget before Flex changes their target."
        (valueCommit)="settingsChanged.emit({ maxDirectionChanges: $event })" />
    </fieldset>
    <fieldset class="parameter-area" data-control-category="rhythm">
      <legend>Rhythm</legend>
      <vc-compact-toggle label="Arpy surprises" [active]="values().arpySurprises ?? false"
        description="At Speed below 20 or above 80, replace certain four-note block rhythms with evenly spaced notes."
        (toggled)="settingsChanged.emit({ arpySurprises: !(values().arpySurprises ?? false) })" />
      <vc-compact-toggle label="Fill pauses per chord" [active]="values().fillPausesPerChord ?? false"
        description="With Fill pauses enabled, protect each chord's first note and keep rest filling within its chord. Repair included chord starts even if paused."
        (toggled)="settingsChanged.emit({ fillPausesPerChord: !(values().fillPausesPerChord ?? false) })" />
    </fieldset>
  </div>
</section>
