<div class="scope-actions" [class.header-actions]="layout() === 'header'">
  @if (layout() === 'header') {
    <button type="button" class="reset-icon" [disabled]="!hasOverrides()" (click)="inheritRequested.emit()"
      title="Reset to inherited" aria-label="Reset to inherited"><span aria-hidden="true">↺</span></button>
  }
  <button type="button" [class.freeze-icon]="layout() === 'header'" (click)="freezeRequested.emit()"
    [attr.aria-label]="group() ? 'Freeze current tracks' : 'Freeze effective settings'"
    title="Store all supported effective musical settings as individual track overrides in this section.">
    @if (layout() === 'header') { <span aria-hidden="true">*</span> }
    @else { {{ group() ? 'Freeze current tracks' : 'Freeze effective settings' }} }
  </button>
  @if (group() && (hasOverrides() || hasExceptions())) {
    <button type="button" (click)="resetCellRequested.emit()"
      title="Remove both this cell’s overrides and all its individual track overrides. Global settings and manual notes are preserved.">
      Reset cell + track overrides
    </button>
  }
  <span class="action-separator" aria-hidden="true">|</span>
  <button type="button" [disabled]="!destinationCount()" (click)="applyRequested.emit('overrides')"
    title="Copy this cell or track’s explicit overrides to the other header-selected sections. Preserve their other settings and track exceptions; exclude the source section.">
    Copy to {{ destinationCount() > 1 ? 'Sections' : 'Section' }} ({{ destinationCount() }})
  </button>
  <button type="button" [disabled]="!destinationCount()" (click)="applyRequested.emit('effective')"
    title="Copy all effective musical settings for the current tracks to the other header-selected sections, replacing those tracks’ overrides. Preserve mixed values, presence, instruments and manual notes; exclude the source section.">
    Copy All to {{ destinationCount() > 1 ? 'Sections' : 'Section' }} ({{ destinationCount() }})
  </button>
  @if (message(); as feedback) {
    <span class="workflow-message" role="status" [title]="feedback">
      <span aria-hidden="true">{{ feedback.startsWith('No settings changed') ? '!' : '✓' }}</span>
      <span class="feedback-text">{{ feedback }}</span>
    </span>
  }
</div>
