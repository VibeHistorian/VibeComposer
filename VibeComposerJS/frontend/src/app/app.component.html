    <div class="app-frame">
      <header class="topbar">
        <div class="brand" aria-label="VibeComposer">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>vibe<span class="brand-light">composer</span></span>
        </div>

        <div class="header-summary">
          <label class="project-name-field"><input [value]="project().name" maxlength="80" aria-label="Project name" (change)="updateProjectName($event)" /></label>
          <span class="host-pill" [class.connected]="appInfo()">
            <span class="status-dot" aria-hidden="true"></span>
            {{ appInfo() ? 'DESKTOP' : 'BROWSER' }}
          </span>
          <span class="session-status">{{ appInfo() ? appInfo()!.version : 'SESSION SAVED IN THIS BROWSER' }}</span>
        </div>

        <div class="project-tools">
          <button type="button" (click)="sectionTypeSettingsOpen.set(true)">Section types</button>
          <button type="button" (click)="projects.undo()" [disabled]="!projects.canUndo() || workspaceUi.editingNoteId() !== null" aria-label="Undo" title="Undo">↶</button>
          <button type="button" (click)="projects.redo()" [disabled]="!projects.canRedo() || workspaceUi.editingNoteId() !== null" aria-label="Redo" title="Redo">↷</button>
          <button type="button" (click)="exportProject()">Export project</button>
          <button type="button" (click)="projectFile.click()">Open project</button>
          <input #projectFile type="file" accept="application/json,.json" hidden (change)="importProject($event)" />
        </div>
      </header>

      @if (projectMessage()) {
        <p class="project-message" role="status">{{ projectMessage() }}</p>
      }

      <vc-workspace-canvas />

      <vc-transport-dock />
      @if (sectionTypeSettingsOpen()) {
        <vc-section-type-settings (closed)="sectionTypeSettingsOpen.set(false)" />
      }
    </div>
