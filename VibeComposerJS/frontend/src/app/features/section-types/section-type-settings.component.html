<section aria-labelledby="section-types-title">
  <h2 id="section-types-title">Section type chances</h2>
  <div class="setting-row">
    <div class="setting-copy"><h3>Track presence defaults</h3><p>Choose each role’s chance of being included when a section is generated or rerolled. Existing sections retain their tracks.</p></div>
    <div class="setting-controls"><button type="button" class="reset-button" (click)="settings.reset()">Reset defaults</button></div>
  </div>
  @for (type of sectionTypes; track type) {
    <div class="setting-row">
      <div class="setting-copy"><h3>{{ sectionLabel(type) }}</h3></div>
      <div class="setting-controls chance-controls">
        @for (part of parts; track part) {
          <vc-compact-knob [label]="sectionLabel(type) + ' ' + partName(part) + ' chance'" [shortLabel]="partName(part)"
            [minimum]="0" [maximum]="100" [defaultValue]="defaultChance(type, part)" [value]="chance(type, part)" unit="%"
            (valueCommit)="settings.setChance(type, part, $event)" />
        }
      </div>
    </div>
  }
</section>
