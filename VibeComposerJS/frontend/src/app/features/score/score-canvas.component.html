<div class="score-gutter" aria-label="Pitch and percussion labels">
  @for (row of gutterRows(); track row.midi + ':' + row.drum) {
    <span class="pitch-key" [class.black-key]="row.black" [class.drum-label]="row.drum" [class.in-scale]="row.inScale"
      [class.out-of-scale]="!row.drum && scaleColoringActive() && !row.inScale" [class.octave-key]="!row.drum && !!row.label"
      [style.top.px]="row.y" [style.height.px]="row.height" [title]="row.drum ? row.label : 'MIDI ' + row.midi"><i>{{ row.label }}</i></span>
  }
  @for (line of octaveLines(); track line.midi) {
    <span class="octave-boundary" aria-hidden="true" [style.top.px]="line.y"
      [style.height.px]="line.height" [style.opacity]="line.opacity"></span>
  }
</div>
<div class="score-canvas-host" #rendererHost>
  @if (noteTooltip(); as tooltip) {
    <div class="note-tooltip" role="tooltip" [style.left.px]="tooltip.x" [style.top.px]="tooltip.y">
      <span class="note-tooltip-values"><span>{{ tooltip.pitch }}</span><span>V{{ tooltip.velocity }}</span></span>
      <small class="note-tooltip-source"><i [style.background]="tooltip.color" aria-hidden="true"></i><span>{{ tooltip.source }} --</span><strong [style.color]="tooltip.color">{{ tooltip.track }}</strong></small>
    </div>
  }
</div>
<div class="horizontal-scroll" #horizontalScroll (scroll)="onHorizontalScroll()" tabindex="0" aria-label="Score horizontal scroll">
  <div #horizontalContent></div>
</div>
<div class="vertical-scroll" #verticalScroll (scroll)="onVerticalScroll()" tabindex="0" aria-label="Score vertical scroll">
  <div #verticalContent></div>
</div>
