patchedDependencies:
  webaudio-tinysynth@1.1.3: patches/webaudio-tinysynth@1.1.3.patch

engineStrict: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
dangerouslyAllowAllBuilds: false

# Angular's native watcher/bundler and optional persistent build cache.
allowBuilds:
  '@parcel/watcher@2.6.0': true
  'esbuild@0.28.2': true
  'lmdb@3.5.6': false
  'msgpackr-extract@3.0.4': true
